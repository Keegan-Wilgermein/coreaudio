[package]
name = "coreaudio"
version = "0.4.1"
edition = "2024"
description = "A safe and simple wrapper around the CoreAudio HAL"
license = "MIT"
documentation = "https://docs.rs/coreaudio"
repository = "https://github.com/Keegan-Wilgermein/coreaudio"
keywords = ["coreaudio", "audio", "hal", "macos", "device"]
categories = ["multimedia::audio", "os::macos-apis"]

[features]
# Process taps (macOS 14.2+), so gate behind a feature
process-tap = ["dep:objc2", "dep:objc2-foundation"]

[dependencies]
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
core-foundation = "0.10.1"
num-traits = "0.2.19"
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSString", "NSValue"] }
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AudioFormat"] }

[package.metadata.docs.rs]
targets = ["x86_64-apple-darwin"]
features = ["process-tap"]
